# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [created, edited, published]
jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        server-id: github
        settings-path: .maven 

    - name: Build with Maven
      working-directory: t1verival
      run: mvn -B package -s .maven/settings.yml
      

    - name: Publish to GitHub Packages Apache Maven
      working-directory: t1verival
      run: mvn deploy -s .maven/settings.yml
      env:
        GITHUB_TOKEN: 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

    - name: Run tests
      working-directory: t1verival
      run: mvn test
      
    - name: Run codecov coverage
      working-directory: t1verival
      run: pytest --cov --cov-branch --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: 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